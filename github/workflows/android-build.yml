name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Permet de lancer la fabrication manuellement

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Decode Keystore
      run: |
        echo "${{ secrets.KEYSTORE_B64 }}" | base64 --decode > app/keystore.jks

    - name: Build Release APK
      run: |
        chmod +x ./gradlew
        ./gradlew assembleRelease -Pandroid.injected.signing.store.file=$PWD/app/keystore.jks -Pandroid.injected.signing.store.password=${{ secrets.KS_PASS }} -Pandroid.injected.signing.key.alias=${{ secrets.KS_ALIAS }} -Pandroid.injected.signing.key.password=${{ secrets.KS_PASS }}

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Mica-Code-APK
        path: app/build/outputs/apk/release/*.apk
