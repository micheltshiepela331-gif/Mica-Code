name: Fabriquer APK Mica Code

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [index.html]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Préparer le projet Android
        run: |
          mkdir www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Mica Code" com.lushipratique.micacode --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Fabriquer l'APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Garder l'APK
        uses: actions/upload-artifact@v4
        with:
          name: micacode-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
